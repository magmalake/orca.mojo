[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "orca.mojo"
version = "0.0.1"
description = "Orchestration for Mojo data pipelines: DAGs in Mojo, cron schedules, a web UI."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tasks]
test-steps = { cmd = "mkdir -p build && mojo build -I src $DEP_INC tests/test_steps.mojo -o build/test-steps && ./build/test-steps" }
test-cli = { cmd = "tests/cli.sh" }
test-compile-fail = { cmd = "tests/compile_fail.sh" }
test = { depends-on = ["test-steps", "test-cli", "test-compile-fail"] }
toy = { cmd = "mkdir -p build && mojo build -I src $DEP_INC examples/toy.mojo -o build/toy" }

# Stable is the default: orca targets Mojo 1.2.0. dista compiles from a
# checkout next to this one (CI lays it out at the revision below), since it
# isn't on mojoshelf yet. Its own dependencies are packages, pinned at the
# revisions dista pins.
[feature.stable.dependencies]
mojo-compiler = "==1.2.0"
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo", rev = "91ff4418b44a89f9354e7d32633e9b11ad365dfd" }
arrow-mlake-mojo = { git = "https://github.com/magmalake/arrow-mlake.mojo", rev = "928a2435371c82395879779225df284e581dfb21" }

[feature.stable.activation.env]
DEP_INC = "-I ../dista.mojo/src"

# A precompiled package only loads in the compiler that built it, so the
# nightly compiles dista's dependencies from checkouts too.
[feature.nightly.dependencies]
modular = ">=26.8.0.dev2026102305,<28"

[feature.nightly.activation.env]
DEP_INC = "-I ../dista.mojo/src -I ../memory-region.mojo/src -I ../arrow-mlake.mojo/src"

# `mojo-compiler` ships no formatter; the nightly `modular` package does.
# `mojo format` has no check mode, so format-check formats and then asserts
# the tree did not move.
[feature.fmt.dependencies]
modular = ">=26.8.0.dev2026102305,<28"

[feature.fmt.tasks]
fmt = { cmd = "mojo format src tests examples" }
format-check = { cmd = "mojo format src tests examples && git diff --exit-code -- src tests examples" }

[environments]
default = ["stable"]
nightly = ["nightly"]
fmt = { features = ["fmt"], no-default-feature = true }

name = "orca-formal"
version = "0.1.0"
defaultTargets = ["Orca", "orca-oracle"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Orca"

# The models as a program: prints what each model says a sequence of events
# leaves behind, for the Mojo tests that replay them (difftest/).
[[lean_lib]]
name = "Oracle"
roots = ["Oracle.Main"]
globs = ["Oracle.+"]

[[lean_exe]]
name = "orca-oracle"
root = "Oracle.Main"

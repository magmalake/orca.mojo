name = "morca-formal"
version = "0.1.0"
defaultTargets = ["Morca", "morca-oracle"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Morca"

# The models as a program: prints what each model says a sequence of events
# leaves behind, for the Mojo tests that replay them (difftest/).
[[lean_lib]]
name = "Oracle"
roots = ["Oracle.Main"]
globs = ["Oracle.+"]

[[lean_exe]]
name = "morca-oracle"
root = "Oracle.Main"

# Where runs' clusters go (K8S.md, orca.kube): the `orca-runs` namespace,
# what the scheduler may do there and nothing else, the database its drivers
# reach, and a hard cap on what all run pods together can ask for.
apiVersion: v1
kind: Namespace
metadata:
  name: orca-runs
---
# For a local cluster, as orca.yaml's; anywhere else, make it yourself.
apiVersion: v1
kind: Secret
metadata:
  name: orca-db
  namespace: orca-runs
stringData:
  url: postgresql://orca:orca-local@postgres.orca.svc:5432/orca
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orca-scheduler
  namespace: orca-runs
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orca-scheduler
  namespace: orca-runs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orca-scheduler
subjects:
  - kind: ServiceAccount
    name: orca-scheduler
    namespace: orca
---
# If orca asks for more than this, the extra pods wait rather than run.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: orca-runs
  namespace: orca-runs
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 64Gi
    pods: "40"

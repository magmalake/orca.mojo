# Where runs' clusters go (K8S.md, morca.kube): the `morca-runs` namespace,
# what the scheduler may do there and nothing else, the database its drivers
# reach, and a hard cap on what all run pods together can ask for.
apiVersion: v1
kind: Namespace
metadata:
  name: morca-runs
---
# For a local cluster, as morca.yaml's; anywhere else, make it yourself.
apiVersion: v1
kind: Secret
metadata:
  name: morca-db
  namespace: morca-runs
stringData:
  url: postgresql://orca:morca-local@postgres.morca.svc:5432/orca
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: morca-scheduler
  namespace: morca-runs
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [create, get, list, watch, delete]
  # A driver's log, kept under MORCA_LOGS before its Job is deleted.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: morca-scheduler
  namespace: morca-runs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: morca-scheduler
subjects:
  - kind: ServiceAccount
    name: morca-scheduler
    namespace: morca
---
# If morca asks for more than this, the extra pods wait rather than run.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: morca-runs
  namespace: morca-runs
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 64Gi
    pods: "40"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.env == 'default' && 'stable' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, nightly]
    defaults:
      run:
        working-directory: orca.mojo
    steps:
      - uses: actions/checkout@v4
        with:
          path: orca.mojo

      # dista compiles from source next door, at the revision orca builds on.
      - uses: actions/checkout@v4
        with:
          repository: magmalake/dista.mojo
          ref: 9e4839937d82f36893285301bf9ce4338dcb14ec
          path: dista.mojo
      # So does k8s, the scheduler's Kubernetes client.
      - uses: actions/checkout@v4
        with:
          repository: magmalake/k8s.mojo
          ref: aa5eb7971284255bde3af8d799c213776ae92a9b
          path: k8s.mojo

      # The nightly compiles dista's dependencies from source too, because
      # their packages are precompiled by 1.2.0. The refs match the pins in
      # pixi.toml.
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/memory-region.mojo
          ref: 40068c4f95ea659e9b78aa91ced45420b07e3e6e
          path: memory-region.mojo
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/arrow-mlake.mojo
          ref: 178aae6e0da0dbe105f9cb02632a51cfd35b9dda
          path: arrow-mlake.mojo
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/objectstore.mojo
          ref: 41fac2800882e5a64da09729262dfa22bbd4ad13
          path: objectstore.mojo
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/postgres.mojo
          ref: 324b2bb61e2e80327654abecf70fd4b2defbc50d
          path: postgres.mojo
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          ref: f45e780a8de77278c140cee36904e46e93e0ca1c
          path: threads.mojo
      # orca ui's server, and the JSON library it imports, at the revisions
      # mojoshelf published as flare_mlake 0.13.0 and json_mlake 0.4.2.
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/flare_mlake
          ref: 541259f938dd2913f691a8facc06882fb8f47ca0
          path: flare_mlake
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/json_mlake
          ref: bcaa7161e757748a1310a213e123bf8810ff7e96
          path: json_mlake

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: pixi.lock is written by this version, and a newer pixi
          # rejects the committed lock with "lock file not up-to-date".
          pixi-version: v0.78.0
          environments: ${{ matrix.env }}
          manifest-path: orca.mojo/pixi.toml

      # The state and kill tests start a throwaway PostgreSQL server from
      # conda-forge's postgresql, on a Unix socket: no service container.
      - name: Tests
        run: pixi run -e ${{ matrix.env }} test

  # orca on a kind cluster (deploy/): the image, built with pixi inside
  # docker, the manifests, and the toy pipeline run by the scheduler's pod.
  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.15.1
        with:
          install_only: true
      - name: The scheduler, Postgres and the UI on kind
        run: tests/kind.sh

  # Every fuzz harness under fuzz/, for a short session each, with all bounds
  # checks on. Longer sessions are a FUZZ_RUNS away locally.
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orca.mojo
    steps:
      - uses: actions/checkout@v4
        with:
          path: orca.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/dista.mojo
          ref: 9e4839937d82f36893285301bf9ce4338dcb14ec
          path: dista.mojo
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: fuzz
          manifest-path: orca.mojo/pixi.toml
      - name: Fuzz
        run: FUZZ_RUNS=20000 pixi run -e fuzz fuzz
      - if: failure()
        name: Show the inputs that found something
        run: |
          for f in build/fuzz-*-last.bin; do echo "$f"; xxd "$f" | head -20; done
          ls -R build/fuzz-crashes || true

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: fmt
      - name: mojo format leaves the tree unchanged
        run: pixi run -e fmt format-check

  # orca.tables over local Iceberg tables, and the taxi example. iceberg,
  # parquet and their siblings compile from source at the revisions
  # iceberg-mojo 0.8.6 was published with (dista's data job uses the same
  # set); memory-region at the fix that lets it share a binary with the
  # standard library's file seek.
  data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orca.mojo
    steps:
      - uses: actions/checkout@v4
        with:
          path: orca.mojo
      - uses: actions/checkout@v4
        with: {repository: magmalake/dista.mojo, ref: 9e4839937d82f36893285301bf9ce4338dcb14ec, path: dista.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/k8s.mojo, ref: aa5eb7971284255bde3af8d799c213776ae92a9b, path: k8s.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/memory-region.mojo, ref: 40068c4f95ea659e9b78aa91ced45420b07e3e6e, path: memory-region.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/arrow-mlake.mojo, ref: 178aae6e0da0dbe105f9cb02632a51cfd35b9dda, path: arrow-mlake.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/parquet.mojo, ref: c15f51aee06ccf73102810e7de143745abba6c90, path: parquet.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/iceberg.mojo, ref: ec4f4e07605b687a2ea9e2fda5dfd4a01aa6ba97, path: iceberg.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/threads.mojo, ref: f45e780a8de77278c140cee36904e46e93e0ca1c, path: threads.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/thrift.mojo, ref: 21cdbce67d22d72e88e88a60e2f168b05b4ef9fa, path: thrift.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/hashes.mojo, ref: 395aca597f9410bd0511df44d972f14b10a8b01d, path: hashes.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/snappy.mojo, ref: b8172ed0a4ef13911cc225d46e26676a5b8f1ccd, path: snappy.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/deflate.mojo, ref: 6639b18c58fad0e009f4224ec9f792cd919398b4, path: deflate.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/avro.mojo, ref: db833d86ddbd7cbaba4dbd79377b0a06009181ec, path: avro.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/roaring.mojo, ref: a90a7bd30cf1c21403a29059282072e93fbeeee2, path: roaring.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/objectstore.mojo, ref: 41fac2800882e5a64da09729262dfa22bbd4ad13, path: objectstore.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/zstd.mojo, ref: 76190bb31012cd2d2f6712c4e1724a66474215db, path: zstd.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/lz4.mojo, ref: 23cd6e54967d7e41573371507228ca5c958ca685, path: lz4.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/brotli.mojo, ref: dcbf840d22e3deaf24c587d12d28570a9a882b7f, path: brotli.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/sqlite.mojo, ref: 0d76aa7b672c85580f4d8c5de855772bc972d535, path: sqlite.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/postgres.mojo, ref: 324b2bb61e2e80327654abecf70fd4b2defbc50d, path: postgres.mojo}
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: data
          manifest-path: orca.mojo/pixi.toml
      - name: Pinned reads and recognised commits
        run: pixi run -e data test-tables
      - name: Chaos over Iceberg (one snapshot per month, however often killed)
        run: pixi run -e data test-chaos-tables
      - name: Lineage over three pipelines' tables, back and forward
        run: pixi run -e data test-lineage
      - name: Sensors and a rebuild (phase 4's gate)
        run: pixi run -e data test-sensors
      - name: Lineage and sensors with the warehouse and logs on MinIO
        run: pixi run -e data test-lineage-s3 && pixi run -e data test-sensors-s3
      - name: Keyed partitions over a dataset of names
        run: pixi run -e data test-keyed
      - name: Keyed backfills and sensors over 20,000 names
        run: pixi run -e data test-keyed-backfills
      - name: A keyed sensor over keys a daily pipeline writes
        run: pixi run -e data test-keyed-sensor
      - name: Keyed partitions named with a /, in logs and the UI
        run: pixi run -e data test-keyed-names
      - name: Six writers committing to one table at once
        run: pixi run -e data test-commits
      # examples/taxi over two sliced TLC months in tests/fixtures/taxi; the
      # full 24-month load is run by hand.
      - name: The taxi pipeline, on fixtures
        run: pixi run -e data test-taxi

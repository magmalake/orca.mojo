name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS runs here, nightly and by hand (Actions > CI > Run workflow), not on
  # PRs or main: its jobs weren't required, often hung for 70-100 minutes,
  # and held runners from the org's small macOS pool while they did.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# A new push to a PR cancels its runs still going: only the latest commit's
# results matter, and the old run's jobs held runners the org shares. Pushes
# to main each run to the end (the group is the commit there).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The tests' runs start whatever the runner's own memory pressure (#202): a
# runner compiling Mojo beside them can stall on memory, and no test's timing
# should hang on that. The scheduler still reads the runner's PSI file;
# tests/pressure.sh sets a limit of its own over a fixture file.
env:
  MORCA_ADMIT_MEMORY_PRESSURE: "0"

jobs:
  # A release PR (only versions, CHANGELOG.md, revs and locks change; see
  # tools/release_only.py in magmalake/.github) skips the nightly leg, kind,
  # fuzz and the data shards below, and runs a consumer build of the PR head
  # instead. The verdict is its own fast job because the jobs below wait for
  # it; the build is the next one.
  release:
    if: github.event_name == 'pull_request'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      classify-only: true

  release-check:
    needs: release
    if: needs.release.outputs.release_only == 'true'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      # The test legs below are skipped on release PRs, and the consumer build
      # is the check (the tests build against sibling checkouts of the other tins).
      task: ""

  # Whether the PR changes anything but prose (*.md, docs/, the licence
  # files), which no test, build or check reads: a prose-only PR skips every
  # other job, and `ci` still reports. Pushes, the nightly, runs by hand, and
  # a failure here all count as code.
  #
  # It also says where the Linux legs (test, rust-worker) run: the
  # repository variable LINUX_RUNNER, a runner label or a JSON list of
  # labels such as ["self-hosted","sai"], else GitHub's ubuntu-latest.
  # NIGHTLY_LINUX_RUNNER, when set, is the nightly's and a run by hand's
  # instead. A fork's pull request always runs on GitHub's runners: a
  # self-hosted runner would run its code.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      linux: ${{ steps.runner.outputs.linux }}
    steps:
      - id: runner
        env:
          LINUX: ${{ vars.LINUX_RUNNER }}
          NIGHTLY: ${{ vars.NIGHTLY_LINUX_RUNNER }}
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          choice=$LINUX
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            if [ -n "$NIGHTLY" ]; then choice=$NIGHTLY; fi
          fi
          if [ "$FORK" = true ] || [ -z "$choice" ]; then choice=ubuntu-latest; fi
          case $choice in
            '['*)
              runs=$(printf '%s' "$choice" | jq -ce 'if type == "array" and length > 0 and all(.[]; type == "string") then . else error("not a list") end') || {
                echo "::error::the runner variable isn't a JSON list of labels: $choice"
                exit 1
              } ;;
            *) runs=$(jq -cn --arg r "$choice" '$r') ;;
          esac
          echo "linux=$runs" >> "$GITHUB_OUTPUT"
          echo "The Linux legs run on $runs"
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.number }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/|^LICENSE$|^NOTICE$)' || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The Linux legs run where `changes` says: GitHub's ubuntu-latest unless
  # the LINUX_RUNNER variable names another (sai, the self-hosted runner,
  # is ["self-hosted","sai"]). On GitHub's runners the environment and the
  # build caches come from the Actions cache; on sai they stay on its disk.
  # No secrets, and the token can only read.
  test:
    name: ${{ matrix.env == 'default' && 'stable' || matrix.env }} / ${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os }} / ${{ matrix.shard }}
    needs: [changes, release]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && fromJSON(needs.changes.outputs.linux || '"ubuntu-latest"') || matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        env: [default, nightly]
        # pixi.toml's three parts of `test`, each on a runner of its own.
        shard: [test-executor-core, test-executor-workers, test-scheduler-ui]
    defaults:
      run:
        working-directory: morca
    steps:
      - uses: actions/checkout@v4
        with:
          path: morca

      # dista compiles from source next door, at the revision morca builds on.
      - uses: actions/checkout@v4
        with:
          repository: morca-dev/dista
          ref: 3f86c92a2616d477ec5a8f856fa5dd2e3fe48d30
          path: dista.mojo
      # So does k8s, the scheduler's Kubernetes client.
      - uses: actions/checkout@v4
        with:
          repository: magmalake/k8s.mojo
          ref: 6cb83ce08e02234873f2d09c7501208eedb5589f
          path: k8s.mojo

      # The nightly compiles dista's dependencies from source too, because
      # their packages are precompiled by 1.2.0. The refs match the pins in
      # pixi.toml.
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/memory-region.mojo
          ref: 40068c4f95ea659e9b78aa91ced45420b07e3e6e
          path: memory-region.mojo
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/arrow-mlake.mojo
          ref: 178aae6e0da0dbe105f9cb02632a51cfd35b9dda
          path: arrow-mlake.mojo
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/objectstore.mojo
          ref: ff66975c095f392695facc1b6dd56823dec914bc
          path: objectstore.mojo
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/postgres.mojo
          ref: 324b2bb61e2e80327654abecf70fd4b2defbc50d
          path: postgres.mojo
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          ref: f45e780a8de77278c140cee36904e46e93e0ca1c
          path: threads.mojo
      # morca ui's server, and the JSON library it imports, at the revisions
      # mojoshelf published as flare_mlake 0.13.0 and json_mlake 0.4.2.
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/flare_mlake
          ref: b1371866a7844afefe86b25eb8af58aaa9d3fa6c
          path: flare_mlake
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/json_mlake
          ref: bcaa7161e757748a1310a213e123bf8810ff7e96
          path: json_mlake
      # morca.sqlite_store's binding, at the revision mojoshelf published as
      # sqlite-mojo 0.3.5.
      - if: matrix.env == 'nightly'
        uses: actions/checkout@v4
        with:
          repository: magmalake/sqlite.mojo
          ref: 0d76aa7b672c85580f4d8c5de855772bc972d535
          path: sqlite.mojo

      # Off before setup-pixi restores rattler's git cache: git's
      # background maintenance in a cached repo races its
      # `git clone --local` (mojo-census#135).
      - run: git config --global maintenance.auto false && git config --global gc.auto 0

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: pixi.lock is written by this version, and a newer pixi
          # rejects the committed lock with "lock file not up-to-date".
          pixi-version: v0.78.0
          environments: ${{ matrix.env }}
          manifest-path: morca/pixi.toml
          # sai installs from the packages it keeps itself, with a pixi of
          # the job's own (setup-pixi won't replace one in ~/.pixi/bin).
          #
          # On GitHub's runners the cached environment is what makes Mojo's
          # compile cache hit: installing takes only ~30 s, but pixi builds
          # the git dependencies again, and their new .mojopkg files miss
          # every entry compiled against the old ones.
          cache: ${{ runner.environment == 'github-hosted' }}
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi
          # Only main and the nightly write the environment cache. Every PR
          # writing ~1 GB per environment kept the repository over GitHub's
          # 10 GB cap, which evicted main's entries: the only ones every PR can
          # read.
          cache-write: ${{ github.event_name != 'pull_request' }}

      # Mojo's compile cache (share/max/cache in the environment) starts
      # empty on GitHub's runners. Restored, it makes builds of code built
      # already 4-6x faster. It's content-addressed, so a stale entry is
      # never used. build/.mojo-build goes with it: scripts/mojo-build.sh
      # keys every binary on its sources, packages and CPU and copies an
      # identical earlier build instead of compiling it (it prunes entries
      # unused for two days itself). Keeping it halved test-executor on a
      # warm runner (#342).
      #
      # Saved per commit, by pull requests too, and restored from the newest
      # of this branch's, else main's (a pull request reads its base
      # branch's caches, never another's). actions/cache doesn't save over
      # an exact hit, which only a re-run of the same commit has.
      # scripts/ci-cache.sh keeps only the files used in the last three
      # days, so an entry doesn't grow with every commit (GitHub keeps 10 GB
      # a repository).
      - if: runner.environment == 'github-hosted'
        id: mojo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            morca/.pixi/envs/${{ matrix.env }}/share/max/cache
            morca/build/.mojo-build
          key: mojo-${{ runner.os }}-${{ matrix.env }}-${{ matrix.shard }}-${{ hashFiles('morca/pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            mojo-${{ runner.os }}-${{ matrix.env }}-${{ matrix.shard }}-${{ hashFiles('morca/pixi.lock') }}-
            mojo-${{ runner.os }}-${{ matrix.env }}-${{ matrix.shard }}-
      - if: runner.environment == 'github-hosted'
        run: sh scripts/ci-cache.sh start .pixi/envs/${{ matrix.env }}/share/max/cache build/.mojo-build

      # On sai both caches stay on its disk instead, outside the checkout
      # (which starts clean), one pair per runner and environment. A runner
      # of its own: each of sai's runners checks out at a path of its own,
      # and a binary names its environment's path (mojo-build.sh keys on
      # it). They're safe to share anyway: Mojo's is content-addressed,
      # mojo-build.sh renames each entry into place whole, and each job
      # holds a shared lock on them while its tests run, which pruning
      # takes alone, skipping when a job is running.
      - if: runner.environment == 'self-hosted'
        name: The build caches on sai's disk
        env:
          ENVNAME: ${{ matrix.env }}
        run: |
          keep="$HOME/.cache/morca-ci/$RUNNER_NAME/$ENVNAME"
          mkdir -p "$keep/max-cache" "$keep/mojo-build"
          rm -rf ".pixi/envs/$ENVNAME/share/max/cache"
          ln -s "$keep/max-cache" ".pixi/envs/$ENVNAME/share/max/cache"
          {
            echo "MOJO_BUILD_CACHE_DIR=$keep/mojo-build"
            echo "MAX_CACHE=$keep/max-cache"
            echo "CACHE_LOCK=$keep/lock"
          } >> "$GITHUB_ENV"
          du -sh "$keep/max-cache" "$keep/mojo-build"

      # The state and kill tests start a throwaway PostgreSQL server from
      # conda-forge's postgresql, on a Unix socket: no service container.
      - name: Tests
        env:
          TASK: ${{ matrix.shard }}
          ENVNAME: ${{ matrix.env }}
        run: |
          if [ -n "${CACHE_LOCK:-}" ]; then
            flock -s "$CACHE_LOCK" pixi run -e "$ENVNAME" "$TASK"
          else
            pixi run -e "$ENVNAME" "$TASK"
          fi

      # On sai, entries a week old go, so the cache can't grow without
      # bound; one still in use is rebuilt once.
      - if: always() && runner.environment == 'self-hosted'
        name: Prune Mojo's compile cache
        run: flock -n -x "$CACHE_LOCK" find "$MAX_CACHE" -type f -mtime +7 -delete || echo "not pruned, a job is using the cache"
      - if: ${{ !cancelled() && runner.environment == 'github-hosted' && steps.mojo-cache.outputs.cache-matched-key != steps.mojo-cache.outputs.cache-primary-key }}
        name: Prune Mojo's compile cache
        run: sh scripts/ci-cache.sh end .pixi/envs/${{ matrix.env }}/share/max/cache build/.mojo-build
      - if: ${{ !cancelled() && runner.environment == 'github-hosted' && steps.mojo-cache.outputs.cache-matched-key != steps.mojo-cache.outputs.cache-primary-key }}
        uses: actions/cache/save@v4
        with:
          path: |
            morca/.pixi/envs/${{ matrix.env }}/share/max/cache
            morca/build/.mojo-build
          key: ${{ steps.mojo-cache.outputs.cache-primary-key }}

  # morca on a kind cluster (deploy/): the image, built with pixi inside
  # docker, the manifests, and the toy pipeline run by the scheduler's pod.
  kind:
    needs: [changes, release]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.15.1
        with:
          install_only: true
      - name: The scheduler, Postgres and the UI on kind
        run: tests/kind.sh

  # The runtime image projects build FROM (deploy/runtime.Dockerfile), and a
  # scratch project's image on it. On pull requests it's built and tested
  # for arm64 and amd64, with the project on arm64 only, the servers'
  # architecture: the project build is the same Dockerfile on both, and
  # main runs it on both before anything is pushed. Never pushed here.
  runtime-image:
    needs: [changes, release]
    if: ${{ !cancelled() && github.event_name != 'schedule' && github.event_name != 'push' && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    uses: ./.github/workflows/runtime-image.yml
    permissions:
      contents: read
    with:
      project: arm64

  # On main: the same, with the project on both architectures, then pushed
  # as ghcr.io/morca-dev/morca-runtime:<sha>. A release tags that image
  # <version> (release.yml), so a release PR's merge commit needs it too.
  # The only job here that can push a package.
  runtime-image-main:
    needs: [changes]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/runtime-image.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true
      project: arm64 amd64

  # deploy/runtime/pixi.lock against what morca-mojo depends on now. Fast,
  # and run on release PRs too (which skip runtime-image), so a release that
  # moves a tin's revision can't merge with a lock main's image can't build
  # from. A stale lock: `sh deploy/runtime/lock.sh` and commit it.
  runtime-lock:
    needs: [changes]
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: git config --global maintenance.auto false && git config --global gc.auto 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          run-install: false
      - run: sh deploy/runtime/lock.sh --check

  # morca's reusable workflows for a project's CI (docs/project-ci.md), each
  # called as a project calls it, on a scratch project that adds this commit
  # of morca-mojo (tests/example-project.sh). Nothing is pushed or released:
  # the image is built on a runtime built from this commit, and the release
  # only writes its notes.
  project-image:
    needs: [changes, release]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    uses: ./.github/workflows/project-image.yml
    permissions:
      contents: read
    with:
      image: ghcr.io/morca-dev/morca-example-project
      prepare: sh tests/example-project.sh build/example-project
      context: build/example-project
      configs: build/example-project/morca.toml
      morca-repository: ${{ github.repository }}
      morca-ref: ${{ github.sha }}
      build-runtime: true
      # The toy runs, and the image has the project's morca.toml where
      # MORCA_CONFIG says, which a bare `morca register` reads (#424).
      smoke: |
        docker run --rm --entrypoint toy "$IMAGE" run --partitions 2024-01
        shown=$(docker run --rm "$IMAGE" config show --file)
        echo "$shown"
        case "$shown" in "# /opt/morca/morca.toml"*) ;; *) echo "::error::no /opt/morca/morca.toml"; exit 1 ;; esac
        case "$shown" in *pipelines.toy*) ;; *) echo "::error::the image's morca.toml has no toy"; exit 1 ;; esac
        docker run --rm "$IMAGE" config check

  project-test:
    needs: [changes, release]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    uses: ./.github/workflows/project-test.yml
    permissions:
      contents: read
    with:
      prepare: sh tests/example-project.sh build/example-project
      manifest-path: build/example-project/pixi.toml
      runners: '["ubuntu-24.04"]'

  project-release:
    needs: [changes, release]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    uses: ./.github/workflows/project-release.yml
    permissions:
      contents: read
    with:
      # A released version's section, which CHANGELOG.md keeps.
      version: "0.23.0"
      image: ghcr.io/morca-dev/morca-example-project
      dry-run: true

  # Every fuzz harness under fuzz/, for a short session each, with all bounds
  # checks on. Longer sessions are a FUZZ_RUNS away locally.
  fuzz:
    needs: [changes, release]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: morca
    steps:
      - uses: actions/checkout@v4
        with:
          path: morca
      - uses: actions/checkout@v4
        with:
          repository: morca-dev/dista
          ref: 3f86c92a2616d477ec5a8f856fa5dd2e3fe48d30
          path: dista.mojo
      # Off before setup-pixi restores rattler's git cache: git's
      # background maintenance in a cached repo races its
      # `git clone --local` (mojo-census#135).
      - run: git config --global maintenance.auto false && git config --global gc.auto 0

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: fuzz
          manifest-path: morca/pixi.toml
          cache-write: ${{ github.event_name != 'pull_request' }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            morca/.pixi/envs/fuzz/share/max/cache
            morca/build/.mojo-build
          key: mojo-${{ runner.os }}-fuzz-${{ hashFiles('morca/pixi.lock') }}-${{ github.run_id }}
          restore-keys: mojo-${{ runner.os }}-fuzz-${{ hashFiles('morca/pixi.lock') }}-
      - run: sh scripts/ci-cache.sh start .pixi/envs/fuzz/share/max/cache build/.mojo-build
      - name: Fuzz
        run: FUZZ_RUNS=20000 pixi run -e fuzz fuzz
      - if: failure()
        name: Show the inputs that found something
        run: |
          for f in build/fuzz-*-last.bin; do echo "$f"; xxd "$f" | head -20; done
          ls -R build/fuzz-crashes || true
      - if: always() && github.event_name != 'pull_request'
        name: Prune Mojo's compile cache
        run: sh scripts/ci-cache.sh end .pixi/envs/fuzz/share/max/cache build/.mojo-build
      - if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            morca/.pixi/envs/fuzz/share/max/cache
            morca/build/.mojo-build
          key: mojo-${{ runner.os }}-fuzz-${{ hashFiles('morca/pixi.lock') }}-${{ github.run_id }}

  format:
    needs: [changes, release]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Off before setup-pixi restores rattler's git cache: git's
      # background maintenance in a cached repo races its
      # `git clone --local` (mojo-census#135).
      - run: git config --global maintenance.auto false && git config --global gc.auto 0

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: fmt
          cache-write: ${{ github.event_name != 'pull_request' }}
      - name: mojo format leaves the tree unchanged
        run: pixi run -e fmt format-check
      - name: nothing reads the old orca names (#384)
        run: sh tests/no-orca.sh
      - name: SQL only in morca.db (#362)
        run: sh tests/sql_in_db.sh
      - name: no file in src/ is over 1,500 lines (#363)
        run: sh tests/file_size.sh

  # The Lean 4 models under formal/: the project builds, no proof is left
  # open or rests on an axiom of its own, and formal/difftest/retry.cases,
  # which the data job's test-formal-retry replays through morca.tables, is
  # the model's output (formal/scripts/check.sh). Lean comes from elan, at
  # the version in formal/lean-toolchain.
  formal:
    needs: [changes, release]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build
        working-directory: formal
        run: lake build
      - name: No sorry, no axioms, and the cases are the oracle's
        run: formal/scripts/check.sh

  # morca.tables over local Iceberg tables, and the taxi example. iceberg,
  # parquet and their siblings compile from source at the revisions
  # iceberg-mojo 0.9.1 was published with (dista's data job uses the same
  # set); memory-region at the fix that lets it share a binary with the
  # standard library's file seek.
  data:
    needs: [changes, release]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    name: data / ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pixi.toml's test-data-<group> tasks, each on a runner of its own:
        # tables (pinned reads, chaos over Iceberg, lineage, six concurrent
        # writers, the taxi pipeline on fixtures), sensors (sensors and a
        # rebuild; lineage and sensors on MinIO) and keyed (keyed partitions,
        # backfills and sensors over 20,000 names, names with a /).
        group: [tables, sensors, keyed]
    defaults:
      run:
        working-directory: morca
    steps:
      - uses: actions/checkout@v4
        with:
          path: morca
      - uses: actions/checkout@v4
        with: {repository: morca-dev/dista, ref: 3f86c92a2616d477ec5a8f856fa5dd2e3fe48d30, path: dista.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/k8s.mojo, ref: 6cb83ce08e02234873f2d09c7501208eedb5589f, path: k8s.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/memory-region.mojo, ref: 40068c4f95ea659e9b78aa91ced45420b07e3e6e, path: memory-region.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/arrow-mlake.mojo, ref: 178aae6e0da0dbe105f9cb02632a51cfd35b9dda, path: arrow-mlake.mojo}
      - uses: actions/checkout@v4
        # parquet-mojo 0.13.0, the revision iceberg-mojo 0.11.0 pins (WriterOptions.compression_level).
        with: {repository: magmalake/parquet.mojo, ref: 5d265f9004fdad1522b80c8770c8a7a7f5f9f089, path: parquet.mojo}
      - uses: actions/checkout@v4
        # iceberg-mojo 0.11.0.
        with: {repository: magmalake/iceberg.mojo, ref: bb361f975f9f56d33218850a5f3d048202a85f02, path: iceberg.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/threads.mojo, ref: f45e780a8de77278c140cee36904e46e93e0ca1c, path: threads.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/thrift.mojo, ref: 21cdbce67d22d72e88e88a60e2f168b05b4ef9fa, path: thrift.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/hashes.mojo, ref: 395aca597f9410bd0511df44d972f14b10a8b01d, path: hashes.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/snappy.mojo, ref: b8172ed0a4ef13911cc225d46e26676a5b8f1ccd, path: snappy.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/deflate.mojo, ref: c3dfb87f5b09fb2559449dcb8b748629da4908af, path: deflate.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/avro.mojo, ref: d5b26ccefa8c49cc3af517731f5df104762119e0, path: avro.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/roaring.mojo, ref: a90a7bd30cf1c21403a29059282072e93fbeeee2, path: roaring.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/objectstore.mojo, ref: ff66975c095f392695facc1b6dd56823dec914bc, path: objectstore.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/zstd.mojo, ref: 76190bb31012cd2d2f6712c4e1724a66474215db, path: zstd.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/lz4.mojo, ref: 23cd6e54967d7e41573371507228ca5c958ca685, path: lz4.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/brotli.mojo, ref: dcbf840d22e3deaf24c587d12d28570a9a882b7f, path: brotli.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/sqlite.mojo, ref: 0d76aa7b672c85580f4d8c5de855772bc972d535, path: sqlite.mojo}
      - uses: actions/checkout@v4
        with: {repository: magmalake/postgres.mojo, ref: 324b2bb61e2e80327654abecf70fd4b2defbc50d, path: postgres.mojo}
      # Off before setup-pixi restores rattler's git cache: git's
      # background maintenance in a cached repo races its
      # `git clone --local` (mojo-census#135).
      - run: git config --global maintenance.auto false && git config --global gc.auto 0

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: data
          manifest-path: morca/pixi.toml
          cache-write: ${{ github.event_name != 'pull_request' }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            morca/.pixi/envs/data/share/max/cache
            morca/build/.mojo-build
          key: mojo-${{ runner.os }}-data-${{ matrix.group }}-${{ hashFiles('morca/pixi.lock') }}-${{ github.run_id }}
          restore-keys: mojo-${{ runner.os }}-data-${{ matrix.group }}-${{ hashFiles('morca/pixi.lock') }}-
      - run: sh scripts/ci-cache.sh start .pixi/envs/data/share/max/cache build/.mojo-build
      - name: The ${{ matrix.group }} tests
        run: pixi run -e data test-data-${{ matrix.group }}
      - if: always() && github.event_name != 'pull_request'
        name: Prune Mojo's compile cache
        run: sh scripts/ci-cache.sh end .pixi/envs/data/share/max/cache build/.mojo-build
      - if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            morca/.pixi/envs/data/share/max/cache
            morca/build/.mojo-build
          key: mojo-${{ runner.os }}-data-${{ matrix.group }}-${{ hashFiles('morca/pixi.lock') }}-${{ github.run_id }}

  # Rust workers (docs/rust-workers.md): the morca-worker crate's tests and
  # examples/rust-worker, a worker and its proxy pipeline over a local
  # warehouse (tests/rust_worker.sh), then examples/hindcast over its
  # committed GRIB2 fixtures, offline (tests/hindcast.sh). In the rust
  # environment: the data environment's tins plus conda-forge's rust (cargo
  # fetches crates; nothing fetches NOAA data). Where `changes` says, as
  # the test legs are. No secrets, and the token can only read.
  rust-worker:
    needs: [changes, release]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.linux || '"ubuntu-latest"') }}
    permissions:
      contents: read
    timeout-minutes: 45
    defaults:
      run:
        working-directory: morca
    steps:
      - uses: actions/checkout@v4
        with:
          path: morca
          persist-credentials: false
      - uses: actions/checkout@v4
        with: {repository: morca-dev/dista, ref: 3f86c92a2616d477ec5a8f856fa5dd2e3fe48d30, path: dista.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/k8s.mojo, ref: 6cb83ce08e02234873f2d09c7501208eedb5589f, path: k8s.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/memory-region.mojo, ref: 40068c4f95ea659e9b78aa91ced45420b07e3e6e, path: memory-region.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/arrow-mlake.mojo, ref: 178aae6e0da0dbe105f9cb02632a51cfd35b9dda, path: arrow-mlake.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/parquet.mojo, ref: 5d265f9004fdad1522b80c8770c8a7a7f5f9f089, path: parquet.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/iceberg.mojo, ref: bb361f975f9f56d33218850a5f3d048202a85f02, path: iceberg.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/threads.mojo, ref: f45e780a8de77278c140cee36904e46e93e0ca1c, path: threads.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/thrift.mojo, ref: 21cdbce67d22d72e88e88a60e2f168b05b4ef9fa, path: thrift.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/hashes.mojo, ref: 395aca597f9410bd0511df44d972f14b10a8b01d, path: hashes.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/snappy.mojo, ref: b8172ed0a4ef13911cc225d46e26676a5b8f1ccd, path: snappy.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/deflate.mojo, ref: c3dfb87f5b09fb2559449dcb8b748629da4908af, path: deflate.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/avro.mojo, ref: d5b26ccefa8c49cc3af517731f5df104762119e0, path: avro.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/roaring.mojo, ref: a90a7bd30cf1c21403a29059282072e93fbeeee2, path: roaring.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/objectstore.mojo, ref: ff66975c095f392695facc1b6dd56823dec914bc, path: objectstore.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/zstd.mojo, ref: 76190bb31012cd2d2f6712c4e1724a66474215db, path: zstd.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/lz4.mojo, ref: 23cd6e54967d7e41573371507228ca5c958ca685, path: lz4.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/brotli.mojo, ref: dcbf840d22e3deaf24c587d12d28570a9a882b7f, path: brotli.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/sqlite.mojo, ref: 0d76aa7b672c85580f4d8c5de855772bc972d535, path: sqlite.mojo, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/postgres.mojo, ref: 324b2bb61e2e80327654abecf70fd4b2defbc50d, path: postgres.mojo, persist-credentials: false}
      # Off before setup-pixi restores rattler's git cache: git's
      # background maintenance in a cached repo races its
      # `git clone --local` (mojo-census#135).
      - run: git config --global maintenance.auto false && git config --global gc.auto 0

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          environments: rust
          manifest-path: morca/pixi.toml
          # No caches: a cached environment (~1.3 GB) and Mojo's and cargo's
          # build caches (~0.4 GB) saved a minute of this job's ~6 (#446).
          cache: false
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi
      - name: Rust workers
        run: pixi run -e rust test-rust-worker
      - name: Hindcast (examples/hindcast, on fixtures)
        run: pixi run -e rust test-hindcast

  # The tests that apply on macOS, on the Mac mini runner (m4-mini, an isolated
  # `ci` user; no Docker, no sudo), for the repo's own code only: a fork's
  # code is arbitrary, and this runner is ours. It runs for information
  # first and isn't in `ci`'s needs; the gate decision comes after a week of
  # runs (#342). The workspace persists between jobs on a self-hosted runner:
  # each job starts from a clean checkout but for .pixi, the built pixi
  # environment, which `pixi install --locked` brings up to the job's
  # pixi.lock. Rebuilding it every job (pixi builds the git dependencies from
  # source) was most of the job's time, and with the Mac busy it once ran out
  # the timeout before a test (#360). Mojo's compile cache lives in the
  # environment and stays with it; build/ goes every job.
  #
  # Left out: what needs Linux (test-cgroups and test-usage read
  # /sys/fs/cgroup, test-pressure and test-sample read /proc, test-kind needs
  # docker), and everything of the data environment (it runs a local
  # warehouse and MinIO, and local mode over an S3 warehouse crashes forked
  # workers on macOS, morca #135). The nightly leg's macos-latest runs the two
  # halves of `test` in full.
  #
  # Also left out, for time: test-versions (5 minutes here), test-hetzner (6,
  # and its hetzner-stacks.sh once failed here, an old scheduler not yet
  # removed once it exited), test-pool-scale, test-pool-scale-ec2 and
  # test-placement. With them the job would pass 45 minutes.
  macos:
    name: macOS (m4)
    needs: [changes, release]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.code != 'false' && needs.release.outputs.release_only != 'true' }}
    runs-on: [self-hosted, m4]
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: morca
    steps:
      # clean: false keeps .pixi; the next step removes everything else.
      - uses: actions/checkout@v4
        with:
          path: morca
          clean: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with: {repository: magmalake/dista.mojo, ref: df018565d71a8f7061350deeeb02f31555526429, path: dista.mojo, clean: true, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: magmalake/k8s.mojo, ref: 6cb83ce08e02234873f2d09c7501208eedb5589f, path: k8s.mojo, clean: true, persist-credentials: false}

      - name: A clean workspace but for the pixi environment
        run: |
          git reset --hard -q HEAD
          git clean -ffdxq -e /.pixi
          rm -rf build
          if [ -n "$(git status --porcelain --ignored | grep -v '^!! \.pixi/$')" ]; then
            git status --porcelain --ignored
            echo "::error::the workspace isn't clean"
            exit 1
          fi
          du -sh .pixi 2> /dev/null || echo "no .pixi yet: this job builds the environment"

      # pixi 0.78.0 is installed for the runner's `ci` user, as the lock
      # needs, and the runner service's PATH has it (the LaunchDaemon's
      # EnvironmentVariables, #360).
      - name: pixi
        run: |
          command -v pixi > /dev/null || { echo "::error::pixi isn't on the runner's PATH: add $HOME/.pixi/bin to PATH in /Library/LaunchDaemons/dev.magmalake.ci-runner.plist's EnvironmentVariables (#360)"; exit 1; }
          echo "user: $(id -un), pixi: $(command -v pixi), $(pixi --version)"

      # An environment a cancelled job left half-installed is built again
      # from nothing.
      - name: Install the environment
        run: |
          start=$(date +%s)
          pixi install --locked -e default || { rm -rf .pixi; pixi install --locked -e default; }
          echo "installed in $(($(date +%s) - start))s"

      - name: Tests
        run: |
          set -e
          pixi run -e default build-shared
          for t in \
            test-steps test-cron test-warehouse test-toml test-upgrade test-source \
            test-highlight test-step-cards test-graph test-locate test-timeline \
            test-metrics test-tasks test-store test-formal-pins test-resources \
            test-recommend test-worker-api test-state test-formal-migrate \
            test-formal-fence test-cli test-logs test-remote test-kill \
            test-scheduler test-chaos test-hcloud test-aws test-worker-procs \
            test-compile-fail test-config test-fill test-chaos-sqlite test-crash \
            test-ec2 test-ui; do
            echo "::group::$t"
            pixi run -e default "$t"
            echo "::endgroup::"
          done

  # On main, the build caches each job saved before this run's go: a pull
  # request restores main's newest, so the older ones only take room from
  # the 10 GB GitHub keeps a repository. Pull requests' own entries go when
  # GitHub evicts them (a week unused, or the oldest first when full).
  cache-prune:
    needs: [test, data, fuzz]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref refs/heads/main --key mojo- --limit 1000 --sort created_at --order desc --json id,key \
            --jq '.[] | "\(.id) \(.key)"' > caches
          # A key is its job's prefix and a commit (or an older run's id).
          seen=" "
          while read -r id key; do
            prefix=${key%-*}
            case $seen in
              *" $prefix "*) echo "delete $key"; gh cache delete "$id" || true ;;
              *) seen="$seen$prefix "; echo "keep   $key" ;;
            esac
          done < caches

  # The one check to require: every Linux job above passed, or, for a
  # prose-only PR, was skipped. (macOS runs only on the nightly, which this
  # gate doesn't cover.)
  ci:
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [release, release-check, changes, test, kind, runtime-image, runtime-image-main, runtime-lock, project-image, project-test, project-release, fuzz, format, formal, data, rust-worker]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          release = needs.pop("release")
          build = needs.pop("release-check")
          # One of the runtime image's jobs runs: main's on a push, the
          # other otherwise.
          needs.pop("runtime-image" if os.environ["EVENT"] == "push" else "runtime-image-main")
          release_only = release["outputs"].get("release_only") == "true"
          prose_only = needs["changes"]["outputs"].get("code") == "false"
          ok = {"success", "skipped"} if release_only or prose_only else {"success"}
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ok}
          for k, v in (("release", release), ("release-check", build)):
              if v["result"] not in ("success", "skipped"):
                  bad[k] = v["result"]
          print("release-only:", release_only, "prose-only:", prose_only,
                "results:", {k: v["result"] for k, v in needs.items()})
          if bad:
              sys.exit(f"did not succeed: {bad}")
          PY

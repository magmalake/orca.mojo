# A PR that changes code adds a changelog fragment, changes/<pr>-<slug>.md
# (changes/README.md); the label no-changelog skips the check.
name: changelog
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  fragment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Off before setup-pixi restores rattler's git cache: git's
      # background maintenance in a cached repo races its
      # `git clone --local` (mojo-census#135).
      - run: git config --global maintenance.auto false && git config --global gc.auto 0

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - run: pixi global install --channel https://mojoshelf.org/channel mojoshelf
      - run: shelf changes check

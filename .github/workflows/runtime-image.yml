# The runtime image, ghcr.io/morca-dev/morca-runtime (deploy/runtime.Dockerfile),
# which project images build FROM (deploy/project.Dockerfile). Called by CI:
# on pull requests to build and test it, and on main to build, test and push
# it as morca-runtime:<sha>. A release builds nothing: it tags the image of
# the commit it releases <version> (release.yml).
#
# One image per architecture, each on its own runner (no emulation), built
# for a baseline CPU (MOJO_TARGET_CPU) from deploy/runtime/pixi.lock and
# tested with tests/runtime-image.sh, which on the architectures in
# `project` also builds a scratch project's image on it. A push sends each
# as <sha>-<arch>, and `manifest` joins them under <sha>.
#
# The jobs ask for no permissions of their own: they get the caller's, so
# only CI's main job, which pushes, has packages: write.
name: runtime image

on:
  workflow_call:
    inputs:
      push:
        description: "Push the image as morca-runtime:<sha> (main only)"
        type: boolean
        default: false
      project:
        description: "The architectures to build and run the scratch project on"
        type: string
        default: "arm64 amd64"

jobs:
  image:
    name: runtime image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            cpu: neoverse-n1
          - arch: amd64
            runner: ubuntu-24.04
            cpu: x86-64-v3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GHCR_IMAGE: ghcr.io/morca-dev/morca-runtime
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      # pixi, for the scratch project's lock (tests/runtime-image.sh).
      - run: git config --global maintenance.auto false && git config --global gc.auto 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          run-install: false
      # No version label: main's image isn't a release yet. The release adds
      # the version to the joined image's index as an annotation.
      - name: Build the runtime image
        run: |
          docker build -f deploy/runtime.Dockerfile \
            --build-arg MOJO_TARGET_CPU=${{ matrix.cpu }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision="$SHA" \
            -t morca-runtime:ci .
          docker image ls morca-runtime:ci --format 'size: {{.Size}}'
      - name: Test it${{ contains(inputs.project, matrix.arch) && ', and a project''s image on it' || '' }}
        run: |
          if ${{ contains(inputs.project, matrix.arch) }}; then
            sh tests/runtime-image.sh morca-runtime:ci --project ${{ matrix.cpu }}
          else
            sh tests/runtime-image.sh morca-runtime:ci
          fi
      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push <sha>-${{ matrix.arch }}
        if: inputs.push
        run: |
          docker tag morca-runtime:ci "$GHCR_IMAGE:$SHA-${{ matrix.arch }}"
          docker push "$GHCR_IMAGE:$SHA-${{ matrix.arch }}"

  # The commit's image as one for both architectures, so each host pulls its
  # own. Only after both pushed: a <sha> tag is an image tested on both.
  manifest:
    needs: image
    if: inputs.push
    runs-on: ubuntu-latest
    env:
      GHCR_IMAGE: ghcr.io/morca-dev/morca-runtime
      SHA: ${{ github.sha }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures
        run: |
          docker buildx imagetools create -t "$GHCR_IMAGE:$SHA" "$GHCR_IMAGE:$SHA-arm64" "$GHCR_IMAGE:$SHA-amd64"
          docker buildx imagetools inspect "$GHCR_IMAGE:$SHA" | grep -E 'Platform: +linux/(arm64|amd64)'

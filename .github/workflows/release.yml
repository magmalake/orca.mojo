# A GitHub release for each orca version, with the Hetzner deploy tooling
# (deploy/hetzner/package.sh) as its assets, so deploying needs no checkout
# of orca.mojo (#247), and its runtime image, orca-runtime:<version>: the
# image CI on main built, tested and pushed for the released commit
# (orca-runtime:<sha>, runtime-image.yml), tagged again, not rebuilt.
# `shelf release` merges a PR from
# release/orca-mojo-<version>: its merge commit is tagged v<version> and
# released. By hand (Actions > release > Run workflow, or `gh workflow run
# release.yml -f version=0.18.0 -f ref=<sha>`) for a version released
# before this workflow, at the commit given.
name: release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: "The version, as in shelf.toml (0.18.0)"
        required: true
      ref:
        description: "The commit to tag v<version> and package"
        required: true

# One release of a version at a time.
concurrency:
  group: release-${{ inputs.version || github.head_ref }}

jobs:
  release:
    # Release PRs are branches of this repository: a fork's PR gets a
    # read-only token, and isn't a release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/orca-mojo-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      runtime: ${{ steps.version.outputs.runtime }}
    env:
      GH_TOKEN: ${{ github.token }}
      WANT_VERSION: ${{ inputs.version }}
      HEAD_REF: ${{ github.head_ref }}
      REF: ${{ inputs.ref || github.event.pull_request.merge_commit_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          # The tags, to check v<version>, and the default branch, for
          # package.sh at a commit from before it.
          fetch-depth: 0

      - name: The version and commit
        id: version
        run: |
          version=${WANT_VERSION:-${HEAD_REF#release/orca-mojo-}}
          version=${version#v}
          sha=$(git rev-parse HEAD)
          # The commit must be that version's: shelf.toml says which it is.
          have=$(sed -n 's/^version = "\(.*\)"$/\1/p' shelf.toml)
          [ "$have" = "$version" ] || { echo "::error::shelf.toml at $sha says $have, not $version"; exit 1; }
          if tagged=$(git rev-parse -q --verify "refs/tags/v$version^{commit}"); then
            [ "$tagged" = "$sha" ] || { echo "::error::v$version is $tagged already, not $sha"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # A version from before the runtime image has none to tag.
          echo "runtime=$([ -f deploy/runtime.Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: The deploy tooling's tarball
        run: |
          # A commit from before package.sh: the default branch's packages it.
          [ -f deploy/hetzner/package.sh ] || git show "origin/$DEFAULT_BRANCH:deploy/hetzner/package.sh" > deploy/hetzner/package.sh
          sh deploy/hetzner/package.sh "$VERSION" "$RUNNER_TEMP/assets"
          tar -tzvf "$RUNNER_TEMP/assets/orca-hetzner-$VERSION.tar.gz"

      # The notes: the version's section of CHANGELOG.md, and how to get the
      # scripts.
      - name: The release
        run: |
          notes=$RUNNER_TEMP/notes.md
          awk -v head="## $VERSION " 'index($0, head) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$notes"
          [ -s "$notes" ] || echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/CHANGELOG.md)." > "$notes"
          cat >> "$notes" << EOF

          **Deploying on Hetzner** ([docs/hetzner.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/hetzner.md)), with no checkout of orca.mojo:

          \`\`\`sh
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/orca-hetzner-$VERSION.tar.gz | tar -xz
          \`\`\`
          EOF
          set -- "$RUNNER_TEMP/assets/orca-hetzner-$VERSION.tar.gz" "$RUNNER_TEMP/assets/orca-hetzner.tar.gz"
          # Run again (an upload that failed), the release gets the assets anew.
          # Otherwise gh makes the tag v<version> at the commit, and the release.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "$@" --clobber
          else
            gh release create "v$VERSION" "$@" --target "$SHA" --title "orca-mojo $VERSION" --notes-file "$notes"
          fi

  # The version's runtime image, ghcr.io/morca-dev/morca-runtime:<version>,
  # which project images build FROM: the released commit's image from CI on
  # main, orca-runtime:<sha>, tagged <version>. Nothing is built here, and a
  # commit with no image fails the job rather than getting one built.
  #
  # The released commit is the release PR's merge commit, so its CI on main
  # starts with this workflow and pushes the image some minutes later: the
  # job waits for the image while that run is going, and fails once the run
  # has finished without it (its runtime image job failed: re-run it, then
  # this job), or when there's no such run (a commit CI on main never
  # pushed an image for, such as one from before it did).
  # Its own job, after the release: Re-run failed jobs runs only this.
  runtime-image:
    needs: release
    if: needs.release.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GHCR_IMAGE: ghcr.io/morca-dev/morca-runtime
      SHA: ${{ needs.release.outputs.sha }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for orca-runtime:<sha>
        run: |
          have() { docker buildx imagetools inspect "$GHCR_IMAGE:$SHA" > /dev/null 2>&1; }
          # The CI run on main for the commit, once GitHub has started it.
          for _ in $(seq 1 10); do
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$SHA" \
              --json databaseId -q '.[0].databaseId // empty')
            if [ -n "$run" ] || have; then break; fi
            sleep 30
          done
          if [ -z "$run" ] && ! have; then
            echo "::error::no CI run on main for $SHA, and no $GHCR_IMAGE:$SHA: is it a commit on main?"
            exit 1
          fi
          until have; do
            status=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json status -q .status) || status=unknown
            if [ "$status" = completed ] && ! have; then
              echo "::error::CI run $run on main finished without pushing $GHCR_IMAGE:$SHA" \
                "(its runtime image jobs failed?): re-run them, then this job"
              exit 1
            fi
            echo "waiting for $GHCR_IMAGE:$SHA (CI run $run: $status)"
            sleep 60
          done
      - name: Tag it ${{ env.VERSION }}
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            -t "$GHCR_IMAGE:$VERSION" "$GHCR_IMAGE:$SHA"
          docker buildx imagetools inspect "$GHCR_IMAGE:$VERSION"
          docker buildx imagetools inspect "$GHCR_IMAGE:$VERSION" | grep -E 'Platform: +linux/(arm64|amd64)'
